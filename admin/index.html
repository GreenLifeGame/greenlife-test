<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         anything but 0 on a notched phone. Without it the padding below is
         silently a no-op on exactly the devices that need it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GREEN LIFE — dev preview</title>
    <!-- Tailwind via CDN: dev-preview only, so the 2D UI styling renders. Not used in production. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* height:100% PINS the document to the viewport, so content taller than
         it overflows instead of making the page grow. min-height lets the
         document actually get longer, which is what makes it scrollable.

         ⚠️ `max(100%, 100vh)` IS A SECOND SAFETY NET, NOT REDUNDANT WITH IT.
         Cody's own screenshot from Phantom's in-app browser (Android S22+)
         still showed a solid dead gap between the game's bottom nav and
         Phantom's toolbar AFTER the shell's own height was already switched
         from `100dvh` to a JS-measured `window.innerHeight`/
         `visualViewport.height` value (see the `appVh` comment in
         green-game.jsx). That means the JS measurement ITSELF is coming back
         smaller than the real available space in this specific embedded
         WebView — the same "resolves once, to a smaller worst-case figure"
         failure mode the original `dvh` fix was written to avoid, just hit
         again one layer down. `100%` here inherits from the initial
         containing block (the true viewport), which browsers keep in sync
         continuously as part of layout — it does not depend on a resize
         event firing, unlike `dvh` or JS `innerHeight`. `100vh` is kept
         alongside it as a floor because `100vh` is normally the TALLER of
         the two on a mobile in-app browser (see the `.screen-scroll` block
         below) — `max()` takes whichever of the two is actually larger, so
         the document can never come up short of the real screen regardless
         of which single metric this WebView happens to under-report. */
      html, body, #root { min-height: max(100%, 100vh); margin: 0; background: #141416; }

      /* ── MOBILE IN-APP BROWSERS COVER THE BOTTOM OF THE PAGE ──────────────
         Phantom's in-app browser (and Metamask's, and Instagram's) float a bar
         over the bottom ~80px of the viewport. It is NOT part of the page, so
         100vh includes the space underneath it — meaning a button sitting at
         the bottom of a full-height screen is rendered *behind* that bar and
         cannot be tapped. Cody hit exactly this trying to buy in: the Continue
         button was unreachable and the page would not scroll any further.

         Two separate problems, two fixes:

         1. `min-h-screen` + `items-center justify-center` CLIPS content taller
            than the viewport. Flexbox centring pushes the overflow off BOTH
            ends, and the part above the top edge cannot be scrolled to at all.
            `justify-start` past a certain height, plus auto margins, keeps it
            centred when it fits and scrollable when it does not.
         2. Even scrolled to the end, the last stretch sits under the browser
            bar. The padding below reserves room for it, plus the safe-area
            inset for notched devices (0 on everything else).

         ⚠️ `!important` IS LOAD-BEARING HERE, NOT LAZINESS. Tailwind is loaded
         from a CDN and injects its stylesheet at RUNTIME — after this block.
         At equal specificity the later rule wins, so Tailwind's `min-h-screen`
         (min-height: 100vh) silently beat the 100dvh below. That was the actual
         bug on Cody's phone: 100vh on a mobile in-app browser is TALLER than
         the visible area, so the container already extended underneath
         Phantom's bar and no amount of padding inside it could help. */
      .screen-scroll {
        /* dvh excludes browser chrome; vh does not. This is the fix. */
        min-height: 100dvh !important;
        /* Room for the floating bar, plus the notch inset on devices that have
           one (0 elsewhere). Generous on purpose — bars vary by app, and being
           20px too tall costs nothing while being 5px too short costs a
           button. */
        padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)) !important;
        justify-content: flex-start !important;
      }
      /* CENTRED WHEN IT FITS, SCROLLABLE WHEN IT DOES NOT.
         Auto-margin pseudo-elements absorb the spare space, so short content
         still looks centred — but they collapse to nothing once the content is
         taller than the screen, so nothing gets pushed off the top where it
         cannot be scrolled back to.
         Done with ::before/::after rather than `> *` deliberately: some of
         these screens (the landing page) have MANY direct children, and auto
         margins on each would spread the logo, wordmark and buttons apart
         instead of keeping them as one centred block. */
      .screen-scroll::before,
      .screen-scroll::after { content: ""; margin: auto; flex: 0 0 0; }

      /* ── THE BOTTOM NAV HAS THE SAME PROBLEM ──────────────────────────────
         The game shell is `height: 100dvh` with the nav as its last flex child,
         which is correct — except `dvh` only accounts for real browser CHROME.
         Phantom's bar is an OVERLAY drawn on top of the page, so dvh knows
         nothing about it and the nav renders underneath: invisible, untappable,
         and with `overflow: hidden` on the shell there is nothing to scroll to
         reach it. Cody had no navigation at all.

         Extra room only on phone-width screens, where those in-app browsers
         live. A desktop browser has no floating bar and gets no wasted space. */
      @media (max-width: 640px) {
        .nav-safe { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)) !important; }
      }
      .nav-safe { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    </style>
    <script type="module" crossorigin src="/admin/assets/index-qXLoT4u5.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
