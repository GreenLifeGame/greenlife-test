<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         anything but 0 on a notched phone. Without it the padding below is
         silently a no-op on exactly the devices that need it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GREEN LIFE — dev preview</title>
    <!-- Tailwind via CDN: dev-preview only, so the 2D UI styling renders. Not used in production. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* ⚠️ `height`, NOT `min-height` — this is a FIXED APP SHELL, not a
         scrolling document. green-game.jsx's own root renders TopBar +
         ONE scrollable content panel (`flex:1, overflowY:"auto"`) + the
         bottom nav, all inside a `display:flex, overflow:"hidden"` column
         pinned to the app's own height. That only produces "the nav stays
         put, the content panel scrolls" if every ancestor from here down to
         that shell is PINNED to exactly the viewport height. `min-height`
         is a FLOOR, not a pin — once real content (e.g. a tall Smoking
         Friends panel) exceeds it, `#root` grows to fit that content
         instead of staying viewport-sized, the inner shell's own height
         inherits that INFLATED number instead of the true viewport height,
         and the whole PAGE starts scrolling with the nav dragged down to
         the bottom of it — exactly the regression Cody hit here. `height`
         (not min) + `overflow: hidden` pins this chain to the real
         viewport no matter how tall the content gets, so all scrolling
         stays where it belongs: inside that one inner panel.

         ⚠️ CORRECTED AGAIN — `max(100%, 100vh)` was ITSELF the dead-gap
         bug, not a fix for it. Researched properly this time (Cody: "go
         research it") instead of guessing a third time. `max()` always
         prefers the LARGER operand, and on mobile `100vh` is defined
         against the browser's LARGEST possible viewport (its own toolbar
         fully collapsed) — it is NOT the current visible area whenever
         that toolbar is actually showing (Phantom's URL bar, in Cody's
         screenshot), which is its normal resting state. So this rule was,
         by construction, sized TALLER than the real visible area almost
         all the time, and the difference is exactly the dead gap below
         the nav. Swap in ANY value here that is even occasionally the
         larger one — a JS snapshot, `100%` — and `max()` guarantees the
         bug survives, because it can only ever move toward the too-tall
         side.

         `dvh` ("dynamic viewport height") is the unit built to solve this:
         unlike `vh`, it tracks the REAL current visible area and updates
         LIVE as the toolbar shows or hides, with zero javascript — so it
         can never go stale the way a resize-event-driven measurement can.
         It reached Baseline (all major engines, effectively all real
         traffic) in June 2025. The `.screen-scroll` class two rules down
         has used plain `dvh` for every onboarding screen this whole
         time with no reported gap — real proof, in this exact file, that
         dvh alone already renders correctly on Cody's own devices. This
         rule is now the same two-line fallback-then-override pattern:
         `100vh` first (skipped entirely by any engine that also
         understands `dvh`), `100dvh` second, which WINS wherever it is
         supported and is simply invalid (thus ignored, per how CSS always
         handles a property it does not recognize) everywhere it is not —
         never a `max()`, `min()` or other blend of the two, because
         blending is exactly what let the too-tall value win before.

         ⚠️ NO `overflow: hidden` HERE, DELIBERATELY. The onboarding stages
         (`.screen-scroll`, below) rely on the DOCUMENT itself being
         scrollable when their content is taller than one screen — that is
         the whole point of `min-height: 100dvh` there rather than a hard
         `height`. `html`'s overflow is special: per spec it propagates to
         the VIEWPORT, so the page scrolls to reveal anything taller than
         this fixed height regardless — `overflow: hidden` here would be
         the one thing that actually disables that and clips the onboarding
         screens. The game shell (green-game.jsx, `stage === "game"`)
         doesn't need it either: it already sets its OWN `overflow:
         "hidden"` on its own div, which is what keeps IT pinned to exactly
         this height with only its one inner content panel scrolling. */
      html, body, #root {
        height: 100vh; /* fallback only — an engine with no dvh support at all */
        height: 100dvh; /* wins wherever supported; tracks the real visible area live */
        margin: 0;
        background: #141416;
      }

      /* ── MOBILE IN-APP BROWSERS COVER THE BOTTOM OF THE PAGE ──────────────
         Phantom's in-app browser (and Metamask's, and Instagram's) float a bar
         over the bottom ~80px of the viewport. It is NOT part of the page, so
         100vh includes the space underneath it — meaning a button sitting at
         the bottom of a full-height screen is rendered *behind* that bar and
         cannot be tapped. Cody hit exactly this trying to buy in: the Continue
         button was unreachable and the page would not scroll any further.

         Two separate problems, two fixes:

         1. `min-h-screen` + `items-center justify-center` CLIPS content taller
            than the viewport. Flexbox centring pushes the overflow off BOTH
            ends, and the part above the top edge cannot be scrolled to at all.
            `justify-start` past a certain height, plus auto margins, keeps it
            centred when it fits and scrollable when it does not.
         2. Even scrolled to the end, the last stretch sits under the browser
            bar. The padding below reserves room for it, plus the safe-area
            inset for notched devices (0 on everything else).

         ⚠️ `!important` IS LOAD-BEARING HERE, NOT LAZINESS. Tailwind is loaded
         from a CDN and injects its stylesheet at RUNTIME — after this block.
         At equal specificity the later rule wins, so Tailwind's `min-h-screen`
         (min-height: 100vh) silently beat the 100dvh below. That was the actual
         bug on Cody's phone: 100vh on a mobile in-app browser is TALLER than
         the visible area, so the container already extended underneath
         Phantom's bar and no amount of padding inside it could help. */
      .screen-scroll {
        /* dvh excludes browser chrome; vh does not. This is the fix. */
        min-height: 100dvh !important;
        /* Room for the floating bar, plus the notch inset on devices that have
           one (0 elsewhere). Generous on purpose — bars vary by app, and being
           20px too tall costs nothing while being 5px too short costs a
           button. */
        padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)) !important;
        justify-content: flex-start !important;
      }
      /* CENTRED WHEN IT FITS, SCROLLABLE WHEN IT DOES NOT.
         Auto-margin pseudo-elements absorb the spare space, so short content
         still looks centred — but they collapse to nothing once the content is
         taller than the screen, so nothing gets pushed off the top where it
         cannot be scrolled back to.
         Done with ::before/::after rather than `> *` deliberately: some of
         these screens (the landing page) have MANY direct children, and auto
         margins on each would spread the logo, wordmark and buttons apart
         instead of keeping them as one centred block. */
      .screen-scroll::before,
      .screen-scroll::after { content: ""; margin: auto; flex: 0 0 0; }

      /* ── THE BOTTOM NAV HAS THE SAME PROBLEM ──────────────────────────────
         The game shell is `height: 100dvh` with the nav as its last flex child,
         which is correct for real, retractable browser CHROME — but Cody
         confirmed (2026-09-27) that Phantom's own bottom bar is NOT that: it
         "never disappears, stays 100% of the time." That is exactly an
         OVERLAY drawn on top of the page rather than real browser chrome —
         `dvh` only ever tracks the latter, so it can never know this bar is
         there at all, permanently or otherwise. The nav must clear it by
         reserved space alone, not by any viewport unit or JS measurement
         ever detecting it.
         ⚠️ Bumped 64px → 110px to MATCH `.screen-scroll`'s own reservation
         above, for the identical bar, rather than a second, smaller guess —
         and because a permanent bar needs a permanently generous margin, not
         a minimal one. Being taller than necessary here is free; being
         shorter costs a hidden, untappable nav.

         Extra room only on phone-width screens, where those in-app browsers
         live. A desktop browser has no floating bar and gets no wasted space. */
      @media (max-width: 640px) {
        .nav-safe { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)) !important; }
      }
      .nav-safe { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    </style>
    <script type="module" crossorigin src="/assets/index-BVsFfXru.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
